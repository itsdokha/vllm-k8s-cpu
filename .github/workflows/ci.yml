name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.4.2
      - run: python -m pytest -q tests

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        run: |
          for f in docker/*/Dockerfile; do
            echo "$f"
            docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml" hadolint/hadolint:v2.12.0 hadolint - < "$f"
          done
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.10.0 docker/vllm/entrypoint.sh k8s/bench/run_bench.sh

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: kustomize build + kubeconform
        run: |
          cp k8s/base/secrets.env.example k8s/base/secrets.env
          { kubectl kustomize k8s/base; echo ---; kubectl kustomize k8s/bench; } \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.33.0 -
