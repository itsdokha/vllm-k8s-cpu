# Job нагрузочного теста ходит только в vLLM и в DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-bench
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: bench
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: server
      ports:
        - port: 8000
          protocol: TCP
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
