apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  replicas: 1
  # PVC в режиме ReadWriteOnce, и на ноде нет памяти на две копии модели,
  # поэтому старый под гасится до запуска нового.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: model-downloader
          image: model-downloader:0.1.0
          envFrom:
            - configMapRef:
                name: model-env
          env:
            - name: CACHE_DIR
              value: /models/compile-cache
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: HF_TOKEN
                  optional: true
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi

      containers:
        - name: vllm
          image: vllm-cpu:0.32.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: model-env
            - configMapRef:
                name: vllm-env
          env:
            - name: SERVE_CONFIG_FILE
              value: /etc/vllm/config.yaml
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: VLLM_API_KEY
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: vllm-config
              mountPath: /etc/vllm
              readOnly: true
            # Кэш torch.compile на том же PVC: первая компиляция на CPU идёт
            # 10-15 минут, с кэшем рестарт пода занимает пару минут.
            - name: models
              mountPath: /home/vllm/.cache
              subPath: compile-cache
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "8"
              memory: 8Gi
            limits:
              memory: 12Gi
          # Первый старт долгий: загрузка весов и компиляция графа (до 30 минут).
          # Под полной загрузкой CPU /health отвечает не мгновенно, отсюда таймауты.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
        - name: vllm-config
          configMap:
            name: vllm-config
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
